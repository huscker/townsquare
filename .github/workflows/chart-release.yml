name: Release Helm Charts

on:
  push:
    branches:
      - develop
    paths:
      - "chart/**"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if ! git show-ref --quiet refs/remotes/origin/gh-pages; then
            git checkout --orphan gh-pages
            git rm -rf . --quiet
            printf 'apiVersion: v1\nentries: {}\ngenerated: "2024-01-01T00:00:00.000000000Z"\n' > index.yaml
            git add index.yaml
            git commit -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "$GITHUB_REF_NAME"
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: chart
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Regenerate index from all releases
        run: |
          CR_BIN=$(find /opt/hostedtoolcache/cr -type f -name cr | head -1)
          if [ -z "$CR_BIN" ]; then
            curl -sSL https://github.com/helm/chart-releaser/releases/download/v1.6.1/chart-releaser_1.6.1_linux_amd64.tar.gz \
              | tar -xz -C /usr/local/bin cr
            CR_BIN=/usr/local/bin/cr
          fi
          owner=$(cut -d '/' -f 1 <<< "$GITHUB_REPOSITORY")
          repo=$(cut -d '/' -f 2 <<< "$GITHUB_REPOSITORY")
          "$CR_BIN" index \
            --owner "$owner" \
            --git-repo "$repo" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --index-path .cr-index/index.yaml \
            --push \
            --pages-branch gh-pages

      - name: Ensure ArtifactHub metadata on gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          if [ ! -f artifacthub-repo.yml ]; then
            cat > artifacthub-repo.yml << 'EOF'
          owners:
            - name: huscker
              email: egorgolubev@bulltrade.org
          EOF
            git add artifacthub-repo.yml
            git commit -m "Add ArtifactHub repository metadata"
            git push origin gh-pages
          fi
